<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PumpOps — Login</title>
  <link rel="stylesheet" href="shared/styles.css" />
  <style>
    .login-logo { text-align: center; padding: 48px 24px 32px; }
    .logo-mark {
      width: 72px; height: 72px;
      background: var(--brand);
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: #fff;
      box-shadow: 0 8px 24px rgba(15,76,129,.3);
    }
    .logo-name { font-size: 28px; font-weight: 800; color: var(--brand); margin-top: 12px; }
    .logo-tagline { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
    .login-form { padding: 0 24px 32px; }
    .role-pills { display: flex; gap: 6px; margin-bottom: 24px; flex-wrap: wrap; }
    .role-pill {
      padding: 6px 14px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
      border: 1.5px solid var(--border);
      cursor: pointer;
      color: var(--text-secondary);
      background: var(--surface);
    }
    .role-pill.active { background: var(--brand); color: #fff; border-color: var(--brand); }
    .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
    .divider::before, .divider::after { content:''; flex:1; height:1px; background:var(--border); }
    .divider span { font-size: 11px; color: var(--text-muted); font-weight: 600; }
    .station-label { font-size: 12px; color: var(--text-muted); margin-top: 20px; text-align: center; }
  </style>
</head>
<body>
  <div class="phone-frame page-content--no-nav" style="min-height:100dvh; display:flex; flex-direction:column; justify-content:center;">
    <div class="login-logo">
      <div class="logo-mark">⛽</div>
      <div class="logo-name">PumpOps</div>
      <div class="logo-tagline">Petrol Pump Operations · V2</div>
    </div>

    <div class="login-form">
      <p class="form-label" style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;">Sign in as</p>
      <div class="role-pills">
        <span class="role-pill active" onclick="selectRole(this)">DSM</span>
        <span class="role-pill" onclick="selectRole(this)">Shift Manager</span>
        <span class="role-pill" onclick="selectRole(this)">Inventory</span>
        <span class="role-pill" onclick="selectRole(this)">Owner</span>
      </div>

      <div class="form-group">
        <label class="form-label">Mobile Number</label>
        <input type="tel" class="form-input" placeholder="98XXXXXXXX" maxlength="10" id="phone" />
      </div>
      <div class="form-group">
        <label class="form-label">PIN</label>
        <input type="password" class="form-input" placeholder="4-digit PIN" maxlength="4" id="pin" inputmode="numeric" />
      </div>

      <button class="btn btn--primary" onclick="doLogin()" style="margin-top:8px;">SIGN IN</button>

      <div class="divider"><span>DEMO QUICK LOGIN</span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <a href="dsm/start-shift.html" class="btn btn--ghost btn--sm" style="font-size:12px;">DSM — Amit</a>
        <a href="manager/home.html" class="btn btn--ghost btn--sm" style="font-size:12px;">Manager — Rajesh</a>
        <a href="inventory/home.html" class="btn btn--ghost btn--sm" style="font-size:12px;">Inventory</a>
        <a href="owner/dashboard.html" class="btn btn--ghost btn--sm" style="font-size:12px;">Owner</a>
      </div>

      <div class="station-label">
        <a href="station-picker.html" style="text-decoration:underline;color:var(--brand);font-weight:600;">SPS Bharat Petroleum · Pune ⛽</a>
      </div>
    </div>
  </div>

  <script>
    function selectRole(el) {
      document.querySelectorAll('.role-pill').forEach(p => p.classList.remove('active'));
      el.classList.add('active');
    }
    function doLogin() {
      const role = document.querySelector('.role-pill.active').textContent.trim();
      const routes = {
        'DSM':           'dsm/start-shift.html',
        'Shift Manager': 'manager/home.html',
        'Inventory':     'inventory/home.html',
        'Owner':         'owner/dashboard.html',
      };
      window.location.href = routes[role] || 'index.html';
    }
  </script>
</body>
</html>
