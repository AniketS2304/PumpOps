<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Audit Log — PumpOps Owner</title>
  <link rel="stylesheet" href="../shared/styles.css" />
</head>
<body>
  <div class="phone-frame">
    <header class="top-bar top-bar--compact">
      <a href="dashboard.html" class="top-bar__back">← Dashboard</a>
      <div class="top-bar__title">System Audit Log</div>
      <div class="top-bar__subtitle">History of shift overrides &amp; corrections</div>
    </header>

    <div class="page-content page-content--no-nav">
      <div style="padding:12px 16px; display:flex; flex-direction:column; gap:10px;" id="logs-container"></div>
    </div>
  </div>

  <script src="../shared/calculations.js"></script>
  <script src="../shared/mock-data.js"></script>
  <script src="../shared/app.js"></script>
  <script>
    const logs = MOCK.auditLog;
    const container = document.getElementById('logs-container');

    container.innerHTML = logs.map(log => `
      <div class="card card--compact">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; border-bottom:1px solid var(--border); padding-bottom:6px;">
          <span class="badge badge--slate" style="font-weight:700;">${log.module}</span>
          <span style="font-size:11px; color:var(--text-muted); font-weight:600;">${log.timestamp}</span>
        </div>
        <div style="font-size:14px; font-weight:700;">${log.dsm} — Field: <span class="text-brand">${log.field}</span></div>
        <div style="display:flex; align-items:center; gap:8px; margin-top:8px; background:var(--surface-2); padding:8px 10px; border-radius:6px; font-size:13px;">
          <span style="color:var(--text-secondary); text-decoration:line-through;">${log.oldValue}</span>
          <span style="color:var(--text-muted);">→</span>
          <span class="text-green fw-700">${log.newValue}</span>
        </div>
        <div style="font-size:12px; color:var(--text-secondary); margin-top:8px; line-height:1.4;">
          <strong>Reason:</strong> ${log.reason}
        </div>
        <div style="font-size:11px; color:var(--text-muted); text-align:right; margin-top:6px; font-weight:600;">
          Edited by: ${log.changedBy} (${log.role})
        </div>
      </div>
    `).join('');
  </script>
</body>
</html>
