<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Variance Report — PumpOps Inventory</title>
  <link rel="stylesheet" href="../shared/styles.css" />
</head>
<body>
  <div class="phone-frame">
    <header class="top-bar top-bar--compact">
      <a href="home.html" class="top-bar__back">← Inventory</a>
      <div class="top-bar__title">Stock Variance</div>
      <div class="top-bar__subtitle">27 Jul 2026</div>
    </header>
    <div class="page-content page-content--no-nav">
      <div style="padding:8px 16px;display:flex;flex-direction:column;gap:6px;">
        <div class="card card--compact" style="background:var(--surface-2);">
          <div class="row" style="border-bottom:none;">
            <span class="row__label fw-700">Products with variance</span>
            <span class="row__value fw-700 text-amber">2 of 6</span>
          </div>
        </div>
        <div id="var-list"></div>
      </div>
    </div>
  </div>
  <script src="../shared/calculations.js"></script>
  <script src="../shared/mock-data.js"></script>
  <script src="../shared/app.js"></script>
  <script>
    const varList = document.getElementById('var-list');
    const withVariance = MOCK.products.filter(p => {
      const exp = p.opening + p.received - p.sold;
      return p.physical !== exp;
    });
    varList.innerHTML = withVariance.map(p => {
      const exp = p.opening + p.received - p.sold;
      const variance = p.physical - exp;
      return `
        <div class="card card--compact card--alert-amber">
          <div style="font-size:13px;font-weight:700;">${p.name}</div>
          <div class="row" style="margin-top:6px;"><span class="row__label">Expected</span><span class="row__value">${exp} ${p.unit}</span></div>
          <div class="row" style="border-bottom:none;"><span class="row__label">Physical</span><span class="row__value fw-700" style="color:${variance<0?'var(--amber)':'var(--blue)'};">${p.physical} ${p.unit} (${variance>=0?'+':''}${variance})</span></div>
        </div>
      `;
    }).join('');
  </script>
</body>
</html>
