<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Stock — PumpOps Inventory</title>
  <link rel="stylesheet" href="../shared/styles.css" />
</head>
<body>
  <div class="phone-frame">
    <header class="top-bar top-bar--compact">
      <a href="home.html" class="top-bar__back">← Inventory</a>
      <div class="top-bar__title">Current Stock</div>
      <div class="top-bar__subtitle">27 Jul 2026</div>
    </header>
    <div class="page-content page-content--no-nav">
      <div style="padding:8px 16px;display:flex;flex-direction:column;gap:6px;" id="stock-list"></div>
    </div>
  </div>
  <script src="../shared/calculations.js"></script>
  <script src="../shared/mock-data.js"></script>
  <script src="../shared/app.js"></script>
  <script>
    const list = document.getElementById('stock-list');
    list.innerHTML = MOCK.products.map(p => {
      const exp = p.opening + p.received - p.sold;
      const variance = p.physical - exp;
      const low = p.physical <= p.reorderLevel;
      return `
        <div class="card card--compact ${low?'card--alert-amber':''}">
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <div>
              <div style="font-size:13px;font-weight:700;">${p.name}</div>
              <div style="font-size:11px;color:var(--text-muted);">${p.category} · Reorder at ${p.reorderLevel} ${p.unit}</div>
            </div>
            <div style="text-align:right;">
              <div style="font-size:18px;font-weight:800;color:${low?'var(--amber)':'var(--text-primary)'};">${p.physical}</div>
              <div style="font-size:11px;color:var(--text-muted);">${p.unit}</div>
            </div>
          </div>
          <div style="margin-top:6px;border-top:1px solid var(--border);padding-top:6px;display:flex;gap:12px;font-size:12px;color:var(--text-muted);">
            <span>Open: ${p.opening}</span>
            <span>+${p.received} rcvd</span>
            <span>−${p.sold} sold</span>
            <span style="color:${variance===0?'var(--green)':variance<0?'var(--amber)':'var(--blue)'};font-weight:700;">Var: ${variance>=0?'+':''}${variance}</span>
          </div>
        </div>
      `;
    }).join('');
  </script>
</body>
</html>
