<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Stock Count — PumpOps Inventory</title>
  <link rel="stylesheet" href="../shared/styles.css" />
</head>
<body>
  <div class="phone-frame">
    <header class="top-bar top-bar--compact">
      <a href="home.html" class="top-bar__back">← Inventory</a>
      <div class="top-bar__title">Stock Count</div>
      <div class="top-bar__subtitle">Physical count · 27 Jul 2026</div>
    </header>
    <div class="page-content page-content--no-nav">
      <div class="alert alert--blue" style="margin:12px 16px 0;">
        <span class="alert__icon">ℹ</span>
        <span style="font-size:13px;">Enter physical count. Expected = Opening + Received − Sold. Variance is auto-calculated.</span>
      </div>
      <div style="padding:8px 16px;display:flex;flex-direction:column;gap:10px;" id="count-list"></div>
      <div class="btn-row">
        <a href="home.html" class="btn btn--ghost">Back</a>
        <button class="btn btn--primary" onclick="APP.showToast('Stock count saved','success')">Save Count</button>
      </div>
    </div>
  </div>

  <script src="../shared/calculations.js"></script>
  <script src="../shared/mock-data.js"></script>
  <script src="../shared/app.js"></script>
  <script>
    const products = MOCK.products;
    const list = document.getElementById('count-list');

    list.innerHTML = products.map((p, i) => {
      const expected = p.opening + p.received - p.sold;
      const variance = p.physical - expected;
      return `
        <div class="card">
          <div style="font-size:14px;font-weight:800;margin-bottom:8px;">${p.name}</div>
          <div class="row">
            <span class="row__label">Opening</span>
            <div style="display:flex;align-items:center;gap:6px;"><span class="row__value">${p.opening} ${p.unit}</span><span class="field-badge field-badge--prev">PREV DAY</span></div>
          </div>
          <div class="row">
            <span class="row__label">Received Today</span>
            <span class="row__value text-green">+${p.received} ${p.unit}</span>
          </div>
          <div class="row">
            <span class="row__label">Sold/Issued</span>
            <span class="row__value text-red">−${p.sold} ${p.unit}</span>
          </div>
          <div class="row">
            <span class="row__label">Expected Closing</span>
            <div style="display:flex;align-items:center;gap:6px;"><span class="row__value fw-700">${expected} ${p.unit}</span><span class="field-badge field-badge--auto">AUTO</span></div>
          </div>
          <div style="margin-top:8px;border-top:1px solid var(--border);padding-top:8px;">
            <label class="form-label">Physical Count</label>
            <input type="number" class="form-input" id="phys-${i}" value="${p.physical}" min="0"
                   oninput="recalcVar(${i}, ${expected}, '${p.unit}')" />
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;">
            <span style="font-size:13px;font-weight:700;">Variance</span>
            <div style="display:flex;align-items:center;gap:6px;">
              <span style="font-size:16px;font-weight:800;color:${variance===0?'var(--green)':variance<0?'var(--amber)':'var(--blue)'};" id="var-${i}">${variance>=0?'+':''}${variance} ${p.unit}</span>
              <span class="field-badge field-badge--auto">AUTO</span>
            </div>
          </div>
        </div>
      `;
    }).join('');

    function recalcVar(i, expected, unit) {
      const physical = parseInt(document.getElementById('phys-' + i).value) || 0;
      const variance = physical - expected;
      const el = document.getElementById('var-' + i);
      el.textContent = (variance >= 0 ? '+' : '') + variance + ' ' + unit;
      el.style.color = variance === 0 ? 'var(--green)' : variance < 0 ? 'var(--amber)' : 'var(--blue)';
    }
  </script>
</body>
</html>
