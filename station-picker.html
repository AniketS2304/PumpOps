<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Select Station — PumpOps</title>
  <link rel="stylesheet" href="shared/styles.css" />
  <style>
    .station-list { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
    .station-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--r-lg);
      padding: 16px;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
    }
    .station-card:hover { border-color: var(--brand); box-shadow: var(--shadow-sm); }
    .station-card--active { border-color: var(--brand); background: var(--brand-light); }
  </style>
</head>
<body>
  <div class="phone-frame page-content--no-nav" style="min-height:100dvh; display:flex; flex-direction:column; justify-content:center;">
    <div style="padding: 24px 24px 8px; text-align: center;">
      <div style="font-size: 32px;">⛽</div>
      <h1 style="font-size:24px; font-weight:800; color:var(--brand); margin-top:8px;">Select Station</h1>
      <p style="font-size:13px; color:var(--text-muted); margin-top:4px;">Choose the retail outlet to configure</p>
    </div>

    <div class="station-list">
      <div class="station-card station-card--active" onclick="selectStation('SPS Bharat Petroleum · Pune')">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:11px; font-weight:700; color:var(--brand); text-transform:uppercase;">Bharat Petroleum</span>
          <span class="badge badge--green">ONLINE</span>
        </div>
        <div style="font-size:16px; font-weight:800; margin-top:6px;">SPS Station · Pune</div>
        <div style="font-size:12px; color:var(--text-secondary); margin-top:2px;">Code: SPS-BPC-001 &nbsp;·&nbsp; 4 Tanks</div>
      </div>

      <div class="station-card" onclick="selectStation('Hindustan Petroleum · Mumbai')">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:11px; font-weight:700; color:#dc2626; text-transform:uppercase;">HPCL</span>
          <span class="badge badge--slate">OFFLINE</span>
        </div>
        <div style="font-size:16px; font-weight:800; margin-top:6px;">Mumbai Highway Fuel</div>
        <div style="font-size:12px; color:var(--text-secondary); margin-top:2px;">Code: HP-MUM-042 &nbsp;·&nbsp; 6 Tanks</div>
      </div>

      <div class="station-card" onclick="selectStation('Indian Oil · Pune East')">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:11px; font-weight:700; color:#d97706; text-transform:uppercase;">Indian Oil</span>
          <span class="badge badge--slate">OFFLINE</span>
        </div>
        <div style="font-size:16px; font-weight:800; margin-top:6px;">Pune East Terminal</div>
        <div style="font-size:12px; color:var(--text-secondary); margin-top:2px;">Code: IOC-PUN-099 &nbsp;·&nbsp; 3 Tanks</div>
      </div>
    </div>

    <div style="padding: 0 16px 24px;">
      <button class="btn btn--primary" onclick="proceed()">PROCEED TO SIGN IN</button>
    </div>
  </div>

  <script>
    let selected = 'SPS Bharat Petroleum · Pune';
    function selectStation(name) {
      selected = name;
      document.querySelectorAll('.station-card').forEach(c => {
        c.classList.remove('station-card--active');
        if(c.textContent.includes(name.split('·')[0].trim())) {
          c.classList.add('station-card--active');
        }
      });
    }
    function proceed() {
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
